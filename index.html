<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f7fa;
    color: #111827;
    overflow: hidden;
}

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 250px;
    background: white;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 21px;
    font-weight: 750;
    padding: 8px 10px 25px;
}

.logoIcon {
    width: 37px;
    height: 37px;
    border-radius: 12px;
    background: #111827;
    color: white;
    display: grid;
    place-items: center;
    font-size: 18px;
}

.newChat {
    border: 0;
    background: #111827;
    color: white;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 18px;
}

.newChat:hover {
    background: #252b35;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.nav button {
    border: 0;
    background: transparent;
    text-align: left;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    color: #4b5563;
    font-size: 14px;
}

.nav button:hover,
.nav button.active {
    background: #f0f2f5;
    color: #111827;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 65px;
    background: rgba(255,255,255,.9);
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 25px;
    justify-content: space-between;
}

.title {
    font-weight: 700;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #6b7280;
    font-size: 13px;
}

.dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
}

/* PAGES */

.page {
    display: none;
    flex: 1;
    min-height: 0;
}

.page.active {
    display: flex;
}

/* CHAT */

.chatPage {
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 35px max(25px, calc((100% - 850px) / 2));
}

.welcome {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.welcome h1 {
    margin: 18px 0 8px;
    font-size: 38px;
    letter-spacing: -1.5px;
}

.welcome p {
    color: #6b7280;
    margin: 0;
}

.aiOrb {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    position: relative;
    background:
        radial-gradient(circle at 35% 30%, white 0 5%, transparent 6%),
        radial-gradient(circle, #dbe4f0 0%, #9baabd 28%, #4b5563 52%, #111827 75%, #e5e7eb 100%);
    box-shadow:
        0 0 35px rgba(17,24,39,.18),
        inset 0 0 30px rgba(255,255,255,.6);
    animation: idle 4s ease-in-out infinite;
}

.aiOrb::before,
.aiOrb::after {
    content: "";
    position: absolute;
    inset: -15px;
    border: 1px solid rgba(75,85,99,.25);
    border-radius: 50%;
    animation: orbit 5s linear infinite;
}

.aiOrb::after {
    inset: -25px;
    border-color: rgba(156,163,175,.15);
    animation-duration: 8s;
    animation-direction: reverse;
}

.aiOrb.thinking {
    animation: thinking .7s ease-in-out infinite alternate;
}

.aiOrb.thinking::before {
    animation-duration: 1.3s;
}

@keyframes idle {
    50% { transform: translateY(-5px) scale(1.015); }
}

@keyframes thinking {
    from { transform: scale(1); }
    to { transform: scale(1.09); }
}

@keyframes orbit {
    to { transform: rotate(360deg); }
}

/* MESSAGE */

.message {
    display: flex;
    margin: 18px 0;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;
    padding: 13px 17px;
    border-radius: 17px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user .bubble {
    background: #111827;
    color: white;
    border-bottom-right-radius: 5px;
}

.ai .bubble {
    background: white;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 5px;
}

/* INPUT */

.inputArea {
    padding: 15px 20px 22px;
    display: flex;
    justify-content: center;
}

.inputBox {
    width: min(850px, 100%);
    background: white;
    border: 1px solid #dfe3e8;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
    padding: 8px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
}

textarea {
    flex: 1;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 10px;
    min-height: 42px;
    max-height: 130px;
    font: inherit;
}

.iconButton,
.sendButton {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
}

.iconButton {
    background: #f1f3f5;
    color: #374151;
}

.sendButton {
    background: #111827;
    color: white;
    font-size: 17px;
}

.iconButton:hover,
.sendButton:hover {
    transform: translateY(-1px);
}

/* BROWSER */

.toolPage {
    flex-direction: column;
}

.toolHeader {
    padding: 15px;
    display: flex;
    gap: 8px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
}

.urlInput {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 11px 14px;
    outline: 0;
}

.goButton {
    border: 0;
    background: #111827;
    color: white;
    border-radius: 10px;
    padding: 0 18px;
    cursor: pointer;
}

iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: white;
}

/* YOUTUBE */

.youtubeHome {
    padding: 30px;
    overflow: auto;
    width: 100%;
}

.youtubeHome h1 {
    font-size: 28px;
}

.searchRow {
    display: flex;
    gap: 8px;
    max-width: 700px;
}

.searchRow input {
    flex: 1;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
}

.searchRow button {
    padding: 0 20px;
    border: 0;
    border-radius: 12px;
    background: #111827;
    color: white;
}

.ytInfo {
    margin-top: 30px;
    padding: 25px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
}

/* MOBILE */

@media(max-width: 700px) {
    .sidebar {
        width: 65px;
        padding: 12px 7px;
    }

    .logo span,
    .newChat,
    .nav button span {
        display: none;
    }

    .logo {
        justify-content: center;
        padding-bottom: 20px;
    }

    .nav button {
        text-align: center;
        font-size: 19px;
    }

    .welcome h1 {
        font-size: 30px;
    }

    .bubble {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logoIcon">N</div>
            <span>Nova AI</span>
        </div>

        <button class="newChat" onclick="newChat()">
            + Neuer Chat
        </button>

        <div class="nav">

            <button class="active" onclick="showPage('chat', this)">
                💬 <span>KI Chat</span>
            </button>

            <button onclick="showPage('browser', this)">
                🌐 <span>Browser</span>
            </button>

            <button onclick="showPage('youtube', this)">
                ▶️ <span>YouTube</span>
            </button>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <div class="title" id="pageTitle">Nova AI</div>

            <div class="status">
                <div class="dot"></div>
                Bereit
            </div>
        </header>

        <!-- CHAT -->

        <section id="chat" class="page active chatPage">

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">

                    <div class="aiOrb" id="orb"></div>

                    <h1>Wie kann ich helfen?</h1>

                    <p>Nova AI ist bereit.</p>

                </div>

            </div>

            <div class="inputArea">

                <div class="inputBox">

                    <textarea
                        id="input"
                        placeholder="Schreibe Nova etwas..."
                        rows="1"
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <button class="iconButton" onclick="startVoice()" title="Spracheingabe">
                        🎤
                    </button>

                    <button class="sendButton" onclick="sendMessage()">
                        ➤
                    </button>

                </div>

            </div>

        </section>

        <!-- BROWSER -->

        <section id="browser" class="page toolPage">

            <div class="toolHeader">

                <input
                    class="urlInput"
                    id="browserUrl"
                    value="https://www.google.com"
                    placeholder="Webadresse..."
                >

                <button class="goButton" onclick="openBrowser()">
                    Öffnen
                </button>

            </div>

            <iframe
                id="browserFrame"
                src="https://www.google.com"
                title="Browser"
            ></iframe>

        </section>

        <!-- YOUTUBE -->

        <section id="youtube" class="page toolPage">

            <div class="youtubeHome">

                <h1>YouTube</h1>

                <div class="searchRow">

                    <input
                        id="ytSearch"
                        placeholder="YouTube suchen..."
                        onkeydown="if(event.key==='Enter') searchYouTube()"
                    >

                    <button onclick="searchYouTube()">
                        Suchen
                    </button>

                </div>

                <div class="ytInfo">
                    <h2>YouTube in Nova</h2>
                    <p>
                        Suche nach Videos und öffne YouTube direkt im Browser.
                    </p>

                    <button class="goButton" onclick="window.open('https://www.youtube.com','_blank')">
                        YouTube öffnen
                    </button>
                </div>

            </div>

        </section>

    </main>

</div>

<script>

/* =====================================================
   GEMINI
   ===================================================== */

/*
   WICHTIG:
   Einen echten Gemini-Key NICHT hier eintragen,
   wenn diese Datei öffentlich auf GitHub liegt.

   Für einen privaten Test kannst du hier deinen Key
   einsetzen, aber er wäre für Besucher sichtbar.
*/

const GEMINI_API_KEY = "";


/* =====================================================
   NAVIGATION
   ===================================================== */

function showPage(page, button) {

    document.querySelectorAll(".page").forEach(p => {
        p.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");

    document.querySelectorAll(".nav button").forEach(b => {
        b.classList.remove("active");
    });

    button.classList.add("active");

    const titles = {
        chat: "Nova AI",
        browser: "Browser",
        youtube: "YouTube"
    };

    document.getElementById("pageTitle").textContent = titles[page];
}


/* =====================================================
   CHAT
   ===================================================== */

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const orb = document.getElementById("orb");

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }

}

function addMessage(text, type) {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const wrapper = document.createElement("div");

    wrapper.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    messages.scrollTop = messages.scrollHeight;

    return bubble;
}


async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    orb.classList.add("thinking");

    const thinkingBubble = addMessage("Nova denkt ...", "ai");

    try {

        if (!GEMINI_API_KEY) {

            thinkingBubble.textContent =
                "Die Oberfläche funktioniert. Für echte Gemini-Antworten musst du eine sichere Gemini-Anbindung einrichten. Einen API-Key solltest du nicht öffentlich in GitHub speichern.";

            return;
        }

        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" +
            encodeURIComponent(GEMINI_API_KEY),
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    contents: [
                        {
                            parts: [
                                {
                                    text: text
                                }
                            ]
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data?.error?.message || "Gemini API Fehler"
            );
        }

        const answer =
            data?.candidates?.[0]?.content?.parts?.[0]?.text;

        thinkingBubble.textContent =
            answer || "Keine Antwort erhalten.";

    } catch (error) {

        console.error(error);

        thinkingBubble.textContent =
            "Fehler bei der Verbindung mit Gemini: " +
            error.message;

    } finally {

        orb.classList.remove("thinking");

    }

}


/* =====================================================
   NEUER CHAT
   ===================================================== */

function newChat() {

    messages.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="aiOrb" id="orb"></div>

            <h1>Wie kann ich helfen?</h1>

            <p>Nova AI ist bereit.</p>

        </div>
    `;

    window.orb = document.getElementById("orb");

}


/* =====================================================
   SPRACHEINGABE
   ===================================================== */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Dein Browser unterstützt keine Spracheingabe."
        );

        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "de-DE";

    recognition.interimResults = false;

    recognition.continuous = false;

    recognition.onstart = () => {

        orb.classList.add("thinking");

    };

    recognition.onresult = event => {

        input.value =
            event.results[0][0].transcript;

    };

    recognition.onerror = event => {

        console.error(event.error);

    };

    recognition.onend = () => {

        orb.classList.remove("thinking");

    };

    recognition.start();

}


/* =====================================================
   BROWSER
   ===================================================== */

function openBrowser() {

    let url =
        document.getElementById("browserUrl").value.trim();

    if (!url) return;

    if (!url.startsWith("http://") &&
        !url.startsWith("https://")) {

        url = "https://" + url;

    }

    document.getElementById("browserFrame").src = url;

}


/* =====================================================
   YOUTUBE
   ===================================================== */

function searchYouTube() {

    const query =
        document.getElementById("ytSearch").value.trim();

    if (!query) return;

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);

    window.open(url, "_blank");

}

</script>

</body>
</html>
