<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#03050b;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:230px;
    background:rgba(5,8,18,.95);
    border-right:1px solid rgba(255,255,255,.08);
    padding:25px 15px;
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
    margin-bottom:45px;
}

.logoOrb{
    width:35px;
    height:35px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,
        white 0%,
        #9aa8ff 12%,
        #5367ff 40%,
        #11183d 70%,
        #03050b 100%);
    box-shadow:
        0 0 20px #6175ff,
        0 0 50px #3148ff;
}

.nav{
    width:100%;
    padding:15px;
    margin-bottom:8px;
    border:none;
    border-radius:14px;
    background:transparent;
    color:#8991a8;
    text-align:left;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.nav:hover,
.nav.active{
    background:rgba(83,103,255,.2);
    color:white;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    height:100%;
}

.page{
    display:none;
    height:100%;
    flex-direction:column;
}

.page.active{
    display:flex;
}

.header{
    height:85px;
    padding:22px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header h1{
    font-size:28px;
}

.header p{
    color:#7f879e;
    margin-top:5px;
}

.status{
    color:#6cff9b;
    font-size:12px;
    letter-spacing:1px;
}

.statusDot{
    display:inline-block;
    width:8px;
    height:8px;
    background:#6cff9b;
    border-radius:50%;
    box-shadow:0 0 15px #6cff9b;
    margin-right:6px;
}

/* AI */

.aiArea{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:0;
}

/* ORB */

.orb{
    width:300px;
    height:300px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
}

.core{
    width:125px;
    height:125px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    letter-spacing:4px;

    background:
        radial-gradient(circle at 35% 30%,
        white 0%,
        #cbd2ff 8%,
        #7182ff 25%,
        #465bff 45%,
        #18204e 70%,
        #03050b 100%);

    box-shadow:
        0 0 20px #8592ff,
        0 0 60px #5265ff,
        0 0 120px rgba(72,88,255,.5);

    transition:.2s;
}

.ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(115,137,255,.6);
}

.ring1{
    width:175px;
    height:175px;
    animation:spin 6s linear infinite;
}

.ring2{
    width:225px;
    height:225px;
    border-style:dashed;
    animation:spinReverse 9s linear infinite;
}

.ring3{
    width:285px;
    height:285px;
    border-color:rgba(110,130,255,.2);
    animation:pulse 2s ease-in-out infinite;
}

.orb.thinking .core{
    transform:scale(1.18);
}

.orb.thinking .ring1{
    animation-duration:1s;
}

.orb.thinking .ring2{
    animation-duration:1.5s;
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    from{transform:rotate(0deg)}
    to{transform:rotate(-360deg)}
}

@keyframes pulse{
    50%{
        transform:scale(1.07);
        opacity:.65;
    }
}

/* MESSAGES */

.messages{
    width:min(760px,90%);
    max-height:190px;
    overflow-y:auto;
}

.message{
    padding:12px 16px;
    margin:7px 0;
    border-radius:15px;
    line-height:1.5;
    white-space:pre-wrap;
}

.message.ai{
    background:rgba(255,255,255,.07);
}

.message.user{
    background:rgba(78,98,255,.3);
    text-align:right;
}

/* CHAT */

.chat{
    width:min(850px,100%);
    padding:15px 25px 25px;
    display:flex;
    gap:10px;
    margin:auto auto 0;
}

.chat input{
    flex:1;
    min-width:0;
    padding:16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    color:white;
    outline:none;
    font-size:15px;
}

.chat input:focus{
    border-color:#6074ff;
}

button{
    cursor:pointer;
}

.mic{
    width:55px;
    border:0;
    border-radius:14px;
    background:#202746;
    color:white;
    font-size:20px;
}

.send{
    border:0;
    border-radius:14px;
    padding:0 20px;
    background:#5367ff;
    color:white;
    font-weight:bold;
}

/* WEB PAGES */

.toolbar{
    display:flex;
    gap:10px;
    padding:0 30px 15px;
}

.toolbar input{
    flex:1;
    padding:15px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    color:white;
    outline:none;
}

.toolbar button{
    padding:0 20px;
    border:0;
    border-radius:13px;
    background:#5367ff;
    color:white;
}

.frame{
    flex:1;
    width:calc(100% - 60px);
    margin:0 30px 20px;
    border:0;
    border-radius:15px;
    background:white;
}

.note{
    color:#727b91;
    font-size:12px;
    padding:0 30px 10px;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:70px;
        padding:20px 8px;
    }

    .logo span{
        display:none;
    }

    .logo{
        justify-content:center;
    }

    .nav{
        text-align:center;
        padding:14px 5px;
        font-size:20px;
    }

    .nav span{
        display:none;
    }

    .header{
        padding:20px;
    }

    .header h1{
        font-size:23px;
    }

    .orb{
        transform:scale(.8);
        margin-top:-20px;
        margin-bottom:-20px;
    }

    .toolbar{
        padding:0 15px 12px;
    }

    .frame{
        width:calc(100% - 30px);
        margin:0 15px 10px;
    }

    .note{
        padding:0 15px 8px;
    }

    .chat{
        padding:12px 15px 18px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logoOrb"></div>
            <span>NOVA</span>
        </div>

        <button class="nav active" data-page="ai">
            🤖 <span>KI</span>
        </button>

        <button class="nav" data-page="youtube">
            ▶️ <span>YouTube</span>
        </button>

        <button class="nav" data-page="browser">
            🌐 <span>Browser</span>
        </button>

    </aside>


    <main class="main">

        <!-- KI -->

        <section id="ai" class="page active">

            <header class="header">

                <div>
                    <h1>Nova AI</h1>
                    <p>Gemini Sprachassistent</p>
                </div>

                <div class="status">
                    <i class="statusDot"></i>
                    ONLINE
                </div>

            </header>


            <div class="aiArea">

                <div class="orb" id="orb">

                    <div class="ring ring1"></div>
                    <div class="ring ring2"></div>
                    <div class="ring ring3"></div>

                    <div class="core">
                        NOVA
                    </div>

                </div>


                <div id="messages" class="messages">

                    <div class="message ai">
                        Hallo! Ich bin Nova. Was möchtest du wissen?
                    </div>

                </div>

            </div>


            <div class="chat">

                <button id="mic" class="mic">
                    🎤
                </button>

                <input
                    id="prompt"
                    type="text"
                    placeholder="Schreibe oder sprich mit Nova..."
                    autocomplete="off"
                >

                <button id="send" class="send">
                    Senden
                </button>

            </div>

        </section>


        <!-- YOUTUBE -->

        <section id="youtube" class="page">

            <header class="header">

                <div>
                    <h1>YouTube</h1>
                    <p>YouTube öffnen</p>
                </div>

            </header>


            <div class="toolbar">

                <input
                    id="youtubeInput"
                    placeholder="Suche auf YouTube..."
                >

                <button id="youtubeButton">
                    Öffnen
                </button>

            </div>


            <iframe
                id="youtubeFrame"
                class="frame"
                title="YouTube"
            ></iframe>

        </section>


        <!-- BROWSER -->

        <section id="browser" class="page">

            <header class="header">

                <div>
                    <h1>Browser</h1>
                    <p>Webseiten öffnen</p>
                </div>

            </header>


            <div class="toolbar">

                <input
                    id="browserInput"
                    placeholder="https://example.com"
                >

                <button id="browserButton">
                    Öffnen
                </button>

            </div>


            <iframe
                id="browserFrame"
                class="frame"
                title="Browser"
            ></iframe>

            <div class="note">
                Einige Webseiten verhindern aus Sicherheitsgründen die Anzeige innerhalb eines Frames.
            </div>

        </section>

    </main>

</div>


<script>

/* NAVIGATION */

const navigationButtons =
    document.querySelectorAll(".nav");

const pages =
    document.querySelectorAll(".page");

navigationButtons.forEach(button => {

    button.addEventListener("click", () => {

        navigationButtons.forEach(
            b => b.classList.remove("active")
        );

        pages.forEach(
            p => p.classList.remove("active")
        );

        button.classList.add("active");

        document
            .getElementById(button.dataset.page)
            .classList.add("active");

    });

});


/* ELEMENTS */

const promptInput =
    document.getElementById("prompt");

const sendButton =
    document.getElementById("send");

const microphone =
    document.getElementById("mic");

const messages =
    document.getElementById("messages");

const orb =
    document.getElementById("orb");


/* MESSAGE */

function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

    return message;
}


/* GEMINI */

async function sendMessage(){

    const message =
        promptInput.value.trim();

    if(!message) return;


    addMessage(message,"user");

    promptInput.value = "";

    orb.classList.add("thinking");

    const thinking =
        addMessage("Nova denkt...","ai");


    try{

        const response =
            await fetch("/api/chat",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:message
                })

            });


        const data =
            await response.json();

        thinking.remove();


        if(!response.ok){

            addMessage(
                data.error ||
                "Die KI konnte nicht antworten.",
                "ai"
            );

            return;
        }


        addMessage(
            data.reply,
            "ai"
        );

        speak(data.reply);


    }catch(error){

        thinking.remove();

        addMessage(
            "Der Server ist nicht erreichbar.",
            "ai"
        );

    }finally{

        orb.classList.remove("thinking");

    }

}


/* SEND */

sendButton.addEventListener(
    "click",
    sendMessage
);


promptInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            sendMessage();
        }

    }
);


/* TEXT TO SPEECH */

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "de-DE";
    voice.rate = 1;
    voice.pitch = 1;

    speechSynthesis.speak(voice);

}


/* SPEECH RECOGNITION */

microphone.addEventListener(
    "click",
    startVoice
);


function startVoice(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!Recognition){

        addMessage(
            "Dein Browser unterstützt keine Spracherkennung.",
            "ai"
        );

        return;
    }


    const recognition =
        new Recognition();


    recognition.lang = "de-DE";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;


    orb.classList.add("thinking");


    recognition.start();


    recognition.onresult =
        event => {

            const text =
                event.results[0][0].transcript;

            promptInput.value = text;

            orb.classList.remove("thinking");

            sendMessage();

        };


    recognition.onerror =
        () => {

            orb.classList.remove(
                "thinking"
            );

        };


    recognition.onend =
        () => {

            orb.classList.remove(
                "thinking"
            );

        };

}


/* YOUTUBE */

const youtubeInput =
    document.getElementById("youtubeInput");

const youtubeFrame =
    document.getElementById("youtubeFrame");

document
    .getElementById("youtubeButton")
    .addEventListener(
        "click",
        openYouTube
    );


youtubeInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            openYouTube();
        }

    }
);


function openYouTube(){

    let value =
        youtubeInput.value.trim();

    if(!value) return;


    if(value.startsWith("http")){

        youtubeFrame.src = value;

    }else{

        youtubeFrame.src =
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(value);

    }

}


/* BROWSER */

const browserInput =
    document.getElementById("browserInput");

const browserFrame =
    document.getElementById("browserFrame");


document
    .getElementById("browserButton")
    .addEventListener(
        "click",
        openBrowser
    );


browserInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            openBrowser();
        }

    }
);


function openBrowser(){

    let url =
        browserInput.value.trim();

    if(!url) return;


    if(!url.startsWith("http://") &&
       !url.startsWith("https://")){

        url = "https://" + url;

    }


    browserFrame.src = url;

}

</script>

</body>
</html>
